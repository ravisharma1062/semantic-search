[project]
name = "semantic-search"
version = "0.1.0"
description = "Semantic search, reranking and RAG service for the document search platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "pydantic-settings[yaml]",
    "structlog",
    "confluent-kafka>=2.15.1",
    "elasticsearch[async]>=8.15,<9",
    "tenacity>=9.1.4",
    "httpx>=0.28.1",
    "redis>=8.1.0",
    "tokenizers>=0.23.2",
]

[dependency-groups]
dev = [
    "hypothesis>=6.168.4",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff",
    "testcontainers>=4.15.0",
]

[tool.uv]
# The service runs from src/ (PYTHONPATH), it is not installed as a package.
package = false

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m 'not integration'"
markers = [
    "integration: needs Docker (real Elasticsearch and Kafka through Testcontainers)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.format]
# Docs are not formatted by ruff (it would rewrite code blocks in docs/HLD.md).
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "SIM", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
mypy_path = ["src", "."]
explicit_package_bases = true
files = ["src", "tests"]
