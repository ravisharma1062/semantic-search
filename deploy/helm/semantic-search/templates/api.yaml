{{- if .Values.api.enabled }}
{{- $ctx := dict "root" . "mode" "api" }}
{{- $container := printf `ports:
  - name: http
    containerPort: %d
livenessProbe:
  httpGet: {path: /health/live, port: http}
  periodSeconds: 10
  failureThreshold: 3
readinessProbe:
  httpGet: {path: /health/ready, port: http}
  periodSeconds: 5
  failureThreshold: 3
startupProbe:
  httpGet: {path: /health/live, port: http}
  periodSeconds: 2
  failureThreshold: 30` (int .Values.api.port) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ss.fullname" . }}-api
  labels:
    {{- include "ss.labels" $ctx | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      {{- include "ss.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ss.labels" $ctx | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      {{- include "ss.podSpec" (dict "root" . "mode" "api" "cfg" .Values.api "container" $container) | nindent 6 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ss.fullname" . }}-api
  labels:
    {{- include "ss.labels" $ctx | nindent 4 }}
spec:
  selector:
    {{- include "ss.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
{{- end }}
