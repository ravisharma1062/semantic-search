{{- if .Values.networkPolicy.enabled }}
{{- if not .Values.networkPolicy.apiIngressFrom }}
{{- fail "networkPolicy.apiIngressFrom is required: only the Java app may call the API" }}
{{- end }}
{{- $release := dict "root" . "mode" "release" }}
# HLD section 16: deny all traffic by default, then allow only the flows of section 15.
# NetworkPolicies add up: this one allows nothing, the next ones open single flows.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ss.fullname" . }}-default-deny
  labels:
    {{- include "ss.labels" $release | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress, Egress]
---
# Ingress to the API: only from the Java app, and metrics from monitoring.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ss.fullname" . }}-api-ingress
  labels:
    {{- include "ss.labels" $release | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ss.selectorLabels" (dict "root" . "mode" "api") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- toYaml .Values.networkPolicy.apiIngressFrom | nindent 8 }}
      ports:
        - {protocol: TCP, port: {{ .Values.api.port }}}
    {{- with .Values.networkPolicy.metricsFrom }}
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - {protocol: TCP, port: {{ $.Values.api.port }}}
    {{- end }}
---
# The worker has no API. Only monitoring may reach its metrics port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ss.fullname" . }}-worker-ingress
  labels:
    {{- include "ss.labels" $release | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ss.selectorLabels" (dict "root" . "mode" "worker") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    {{- with .Values.networkPolicy.metricsFrom }}
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - {protocol: TCP, port: {{ $.Values.worker.metricsPort }}}
    {{- end }}
---
# Egress: DNS, and the allow-list of the environment (Kafka, Elasticsearch, Redis, model servers,
# observability, the egress proxy for OpenAI). The platform team fills networkPolicy.egress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ss.fullname" . }}-egress
  labels:
    {{- include "ss.labels" $release | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.dnsNamespace }}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    {{- with .Values.networkPolicy.egress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
