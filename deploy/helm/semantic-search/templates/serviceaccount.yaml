{{- /* One service account per mode, so rights can differ later (HLD section 16). */}}
{{- range $mode := list "api" "worker" "batch" }}
{{- if get (index $.Values $mode) "enabled" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ss.fullname" $ }}-{{ $mode }}
  labels:
    {{- include "ss.labels" (dict "root" $ "mode" $mode) | nindent 4 }}
{{- end }}
{{- end }}
