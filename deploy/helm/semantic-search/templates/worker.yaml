{{- if .Values.worker.enabled }}
{{- $ctx := dict "root" . "mode" "worker" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ss.fullname" . }}-worker
  labels:
    {{- include "ss.labels" $ctx | nindent 4 }}
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      {{- include "ss.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ss.labels" $ctx | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      # Time for the worker to finish the current message before it is killed.
      terminationGracePeriodSeconds: 60
      {{- $container := printf `livenessProbe:
  exec:
    command:
      - sh
      - -c
      - test $(( $(date +%%s) - $(stat -c %%Y %s) )) -lt %d
  initialDelaySeconds: 60
  periodSeconds: 20
  failureThreshold: 3` .Values.worker.heartbeatFile (int .Values.worker.heartbeatMaxAgeSeconds) }}
      {{- include "ss.podSpec" (dict "root" . "mode" "worker" "cfg" .Values.worker "container" $container) | nindent 6 }}
{{- end }}
