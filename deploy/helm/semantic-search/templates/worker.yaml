{{- if .Values.worker.enabled }}
{{- $ctx := dict "root" . "mode" "worker" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ss.fullname" . }}-worker
  labels:
    {{- include "ss.labels" $ctx | nindent 4 }}
spec:
  {{- if not .Values.worker.keda.enabled }}
  replicas: {{ .Values.worker.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "ss.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ss.labels" $ctx | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.worker.metricsPort | quote }}
        prometheus.io/path: /metrics
    spec:
      # Time for the worker to finish the current message before it is killed.
      terminationGracePeriodSeconds: 60
      {{- $container := printf `ports:
  - name: metrics
    containerPort: %d
livenessProbe:
  exec:
    command:
      - sh
      - -c
      - test $(( $(date +%%s) - $(stat -c %%Y %s) )) -lt %d
  initialDelaySeconds: 60
  periodSeconds: 20
  failureThreshold: 3` (int .Values.worker.metricsPort) .Values.worker.heartbeatFile (int .Values.worker.heartbeatMaxAgeSeconds) }}
      {{- include "ss.podSpec" (dict "root" . "mode" "worker" "cfg" .Values.worker "container" $container) | nindent 6 }}
{{- end }}
