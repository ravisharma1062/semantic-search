name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  UV_VERSION: "0.8.22"

jobs:
  quality:
    name: Lint, types, unit and integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install uv
        run: python -m pip install "uv==${UV_VERSION}"
      - name: Install dependencies
        run: uv sync --frozen
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy src tests
      - name: Unit tests
        run: uv run pytest -q
      - name: Integration tests
        # Docker is available on ubuntu-latest, so Testcontainers work from task T1.2.
        # Exit code 5 means "no tests collected", which is true until T1.2.
        # Remove the exit-code check in T1.2.
        run: uv run pytest -q -m integration || [ $? -eq 5 ]

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint
        run: helm lint deploy/helm/semantic-search
      - name: Render every mode
        run: |
          helm template ci deploy/helm/semantic-search --set batch.enabled=true > /dev/null

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (no push)
        run: docker build -f deploy/Dockerfile -t semantic-search:ci .
      - name: Check the image runs as non-root
        run: test "$(docker run --rm --entrypoint id semantic-search:ci -u)" != "0"

  # Not in T1.1, each belongs to a later task:
  #   - dependency and image vulnerability scan: T5.3 (the scanner must be named by security)
  #   - evaluation smoke set: T2.5
  #   - push of the image, deploy to Test and Prod with approval and canary: T5.5
